---
- name: Check if grub-customizer is already installed
  ansible.builtin.command: dpkg-query -W {{ grub_customizer_package_name }}
  register: grub_customizer_installed
  failed_when: false
  changed_when: false

# add-apt-repository handles GPG key import automatically for ppa: shorthand.
# On noble the PPA doesn't exist yet — ignore_errors allows fallback to distro repos
# (e.g. Linux Mint ships grub-customizer in its own repo).
# On Debian PPAs are not supported — also ignored.
- name: Add PPA repository for grub-customizer
  ansible.builtin.shell: add-apt-repository ppa:danielrichter2007/grub-customizer -y
  become: true
  ignore_errors: true
  when: grub_customizer_installed.rc != 0

- name: Install grub-customizer
  ansible.builtin.apt:
    name: "{{ grub_customizer_package_name }}"
    state: present
    update_cache: true
  become: true
  when: grub_customizer_installed.rc != 0
